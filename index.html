<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Hajatan</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#000;--tx2:#6c6c70;--line:#e5e5ea;--ac:#007aff;--red:#ff3b30;--grn:#34c759}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#fff;--tx2:#98989f;--line:#38383a;--ac:#0a84ff;--red:#ff453a;--grn:#30d158}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;margin:0 -16px}
.top{display:flex;align-items:center;justify-content:space-between}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--ac);font-size:20px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.search{margin-top:10px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:0;background:rgba(120,120,128,.18);background:color-mix(in srgb,var(--tx2) 18%,transparent);color:var(--tx);font-size:17px;outline:none}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.row2{display:flex;gap:8px;margin-top:10px}
select{flex:1;padding:9px;border-radius:10px;border:0;background:var(--card);color:var(--tx);font-size:15px}
.stat{color:var(--tx2);font-size:13px;margin:14px 4px 6px;display:flex;justify-content:space-between}
.list{background:var(--card);border-radius:14px;overflow:hidden}
:root{--cols:minmax(0,1.15fr) minmax(0,1fr) 112px}
.item{display:grid;grid-template-columns:var(--cols);column-gap:8px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.item .nm{font-size:16px;word-break:break-word}
.item .ad{margin:0;word-break:break-word}
.item .kt{color:var(--tx2);font-size:12px;margin-top:2px;word-break:break-word}
.item .nom{text-align:right;font-size:15px}
.item:last-child{border:0}
.item:active{background:rgba(120,120,128,.12);background:color-mix(in srgb,var(--tx2) 12%,transparent)}
.nm{font-weight:600;font-size:17px}
.ad{color:var(--tx2);font-size:14px;margin-top:2px}
.nom{font-weight:700;color:var(--grn);white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--tx2)}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.3}
.btn.g{background:var(--card);color:var(--ac)}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:56px;height:56px;border-radius:50%;font-size:30px;border:0;background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:440px;max-height:90vh;overflow:auto;border-radius:20px;padding:20px 16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet input,.sheet textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
.acts{display:flex;gap:8px}.acts .btn{flex:1;justify-content:center;padding:12px 20px}.acts .btn svg{width:22px;height:22px;stroke-width:2}
.del{background:var(--red)!important}
.tools{display:flex;gap:8px;margin-top:16px}.tools .btn{flex:1;font-size:14px;padding:10px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ib{display:inline-flex;align-items:center;justify-content:center}
.hb{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:4px}
.search span svg{width:18px;height:18px}
.fab{display:flex;align-items:center;justify-content:center}.fab svg{width:26px;height:26px;stroke-width:2}
body.locked .wrap,body.locked .fab{display:none}
#lg{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
body.locked #lg{display:flex}
.lbox{width:100%;max-width:360px;text-align:center}
.mark{width:64px;height:64px;border-radius:18px;margin:0 auto 18px;background:var(--card);color:var(--ac);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.mark svg{width:30px;height:30px}
.lbox h2{margin:0 0 4px;font-size:26px;letter-spacing:-.4px}
.lbox p{margin:0 0 20px;color:var(--tx2);font-size:15px}
.lbox input[type=text],.lbox input[type=password]{width:100%;padding:14px;margin-bottom:10px;border-radius:12px;border:0;background:var(--card);color:var(--tx);font-size:17px;outline:none}
.lbox .btn{width:100%;justify-content:center;padding:14px;margin-top:6px}
.keep{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:14px;margin:4px 2px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.lnk{background:none;border:0;color:var(--ac);font-size:14px;margin-top:14px;cursor:pointer}
.seg{display:flex;background:rgba(120,120,128,.18);background:color-mix(in srgb,var(--tx2) 18%,transparent);border-radius:10px;padding:2px;margin-top:10px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:8px 4px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.seg button{transition:.15s}.seg button.on{background:var(--ac);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}.seg button.on small{color:rgba(255,255,255,.8)}
.seg small{color:var(--tx2);font-weight:500;margin-left:5px}
.sheet select{width:100%;flex:none;padding:12px;margin-bottom:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;border-radius:10px;color:var(--tx)}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);font-size:17px;cursor:pointer;text-align:left;font-family:inherit}
.sg .srow:last-child{border:0}.srow svg{color:var(--ac);flex:none}
.srow.r,.srow.r svg{color:var(--red)}
.chips{display:grid;grid-template-columns:var(--cols);column-gap:8px;padding:0 8px;margin-top:10px}
.chips .dd{min-width:0}
.chips .chip{width:100%;min-width:0;justify-content:space-between;padding:8px 10px}
.chips .chip>svg:first-child{display:none}
.chips .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips .dd:last-child .menu{left:auto;right:0;transform-origin:top right}
.dd{position:relative}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:0;background:var(--card);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);font-family:inherit;transition:.15s}
.chip svg{width:16px;height:16px}.chip .cv{width:14px;height:14px;opacity:.6}
.chip.on{background:var(--ac);color:#fff}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:160px;background:var(--card);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:4px;opacity:0;transform:scale(.94) translateY(-4px);transform-origin:top left;pointer-events:none;transition:.16s;z-index:30}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 12px;border:0;background:none;color:var(--tx);font-size:16px;border-radius:10px;cursor:pointer;font-family:inherit}
.menu button:active{background:rgba(120,120,128,.18);background:color-mix(in srgb,var(--tx2) 18%,transparent)}
.menu button.sel{color:var(--ac);font-weight:600}.menu button.sel::after{content:"✓";font-weight:700}
#evm button.sel::after{content:none}
#evm{min-width:250px;max-width:calc(100vw - 32px)}
.er{display:flex;align-items:center}
.menu .er .en{flex:1;min-width:0;text-align:left;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu .er .ei{width:38px;flex:none;justify-content:center;padding:11px 0;color:var(--tx2)}
.menu .er .ei.r{color:var(--red)}
.menu .er .ei svg{width:18px;height:18px}
.fdd{margin-bottom:10px}.fdd .menu{width:100%}
.fsel{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;cursor:pointer}
.fsel svg{width:16px;height:16px;opacity:.6}
.evrow{margin-top:6px}.evc{color:var(--tx)}.evc span{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--tx2);font-size:13px;margin:-4px 2px 10px}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-2px 0 12px}
.qk button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ac);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.qk button:active{background:var(--ac);color:#fff}
#cf{z-index:50;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cfs{max-width:330px;text-align:center;padding:26px 20px 18px;animation:cfp .18s ease-out}
@keyframes cfp{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.cfi{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.cfi svg{width:28px;height:28px;stroke-width:2}
.cfi.d{background:rgba(255,59,48,.14);color:var(--red)}
.cfi.w{background:rgba(0,122,255,.14);color:var(--ac)}
.cfs h2{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}
.cfs p{margin:0 0 18px;color:var(--tx2);font-size:15px;line-height:1.45;white-space:pre-line;word-break:break-word}
.cfs input{text-align:center;margin-bottom:14px;letter-spacing:2px;font-weight:600}
.cfs .acts .btn{padding:13px 10px;font-size:16px;font-weight:600}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ck{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;cursor:pointer}
.ck input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--ac);flex:none}
.ck:has(input:checked){border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
.ib{position:relative}
.bdg{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;padding:0 4px}
.rit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rit .btn{padding:8px 12px;font-size:14px;flex:none}
.rit.late .ad{color:var(--red)}
.rsub{margin:14px 0 8px;font-size:14px;color:var(--tx2);font-weight:600}
.item .kt{font-weight:400}
.item .no{color:var(--tx2);font-size:12px;font-weight:400;min-width:20px;padding-top:4px;flex:none}
.sm-h{color:var(--tx2);font-size:13px;margin-bottom:2px}
.sm-big{font-size:34px;font-weight:700;letter-spacing:-.8px}
.sm-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.sm-kv div{background:var(--bg);border-radius:12px;padding:10px}
.sm-kv small{display:block;color:var(--tx2);font-size:12px;margin-bottom:2px}
.sm-kv b{font-size:20px}
.sm-t{font-size:13px;color:var(--tx2);font-weight:600;margin:20px 0 10px}
.sm-r{margin-bottom:14px}
.sm-top{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sm-top span:last-child{color:var(--tx2);font-size:13px;white-space:nowrap}
.sm-bar{height:8px;border-radius:4px;margin-top:7px;overflow:hidden;background:rgba(120,120,128,.18);background:color-mix(in srgb,var(--tx2) 18%,transparent)}
.sm-bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
#ths{margin:0;width:100px;flex:none}#ths button{display:flex;align-items:center;justify-content:center;padding:7px 0}#ths svg{color:inherit;width:18px;height:18px}
</style>
</head>
<body class="locked">
<div id="lg"><div class="lbox">
 <div class="mark"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
 <h2 id="lt">Masuk</h2><p id="ls">Catatan Hajatan</p>
 <input type="text" id="lu" placeholder="Nama pengguna" autocomplete="username" autocapitalize="none">
 <input type="password" id="lp" placeholder="Kata sandi" autocomplete="current-password">
 <input type="password" id="lp2" placeholder="Ulangi kata sandi" style="display:none">
 <label class="keep"><input type="checkbox" id="lk"> Tetap masuk di perangkat ini</label>
 <button class="btn" id="lb">Masuk</button>
 <button class="btn g" id="sk">Lewati, langsung masuk</button>
 <div class="err" id="le"></div>
 <button class="lnk" id="lr">Lupa kata sandi?</button>
</div></div>
<div class="wrap">
<header>
 <div class="top"><h1>Catatan Hajatan</h1><div class="hb"><button class="ib" id="bell" title="Pengingat"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 003.4 0"/></svg><span class="bdg" id="bdg" style="display:none"></span></button><button class="ib" id="gear" title="Pengaturan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div></div>
 <div class="evrow"><div class="dd"><button class="chip evc" id="evb"><span id="evl">Acara</span><svg viewBox="0 0 24 24" class="cv"><path d="M6 9l6 6 6-6"/></svg></button><div class="menu" id="evm"></div></div></div>
 <div class="seg" id="seg"></div>
 <div class="search"><span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span><input id="q" type="search" placeholder="Ketik nama..." autocomplete="off"></div>
 <div class="chips">
  <div class="dd"><button class="chip on" id="bn"><svg viewBox="0 0 24 24"><path d="M3 17l3.5-9L10 17M4.5 14h4M14 8h6l-6 8h6"/></svg><span>Nama</span><svg viewBox="0 0 24 24" class="cv"><path d="M6 9l6 6 6-6"/></svg></button>
   <div class="menu"><button data-s="az">A → Z</button><button data-s="za">Z → A</button></div></div>
  <div class="dd"><button class="chip" id="ba"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Alamat</span><svg viewBox="0 0 24 24" class="cv"><path d="M6 9l6 6 6-6"/></svg></button>
   <div class="menu"><button data-s="aaz">A → Z</button><button data-s="aza">Z → A</button></div></div>
  <div class="dd"><button class="chip" id="bm"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5V8M12 16v1.5"/></svg><span>Nominal</span><svg viewBox="0 0 24 24" class="cv"><path d="M6 9l6 6 6-6"/></svg></button>
   <div class="menu"><button data-s="hi">Terbesar</button><button data-s="lo">Terkecil</button></div></div>
 </div>
</header>
<div class="stat"><span id="cnt"></span><span id="tot"></span></div>
<div class="list" id="list"></div>
<div class="pager">
 <button class="btn g" id="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span id="pg" style="color:var(--tx2);font-size:14px"></span><button class="btn g" id="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<input type="file" id="file" accept=".txt,text/plain,.json,.csv" hidden>
</div>
<button class="fab" id="add" title="Tambah"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="modal" id="md"><div class="sheet">
 <h2 id="mt">Tambah Tamu</h2>
 <div class="dd fdd"><button type="button" class="fsel" id="fTb"><span id="fTl">Pengantin</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <div class="menu" id="fTm"><button type="button" data-v="pengantin">Pengantin</button><button type="button" data-v="bapak">Bapak</button><button type="button" data-v="ibu">Ibu</button></div></div>
 <input type="hidden" id="fT" value="pengantin">
 <input id="fn" placeholder="Nama">
 <input id="fa" placeholder="Alamat">
 <input id="fm" inputmode="numeric" placeholder="Nominal (Rp)" autocomplete="off">
 <div class="qk" id="qk"><button type="button" data-v="50000">50rb</button><button type="button" data-v="100000">100rb</button><button type="button" data-v="150000">150rb</button><button type="button" data-v="200000">200rb</button></div>
 <div class="rsub" style="margin:2px 0 8px">Barang (opsional)</div>
 <div id="gl"></div>
 <input id="gn" list="gdl" placeholder="Jenis barang (mis. Beras)" autocomplete="off"><datalist id="gdl"></datalist>
 <datalist id="gud"><option value="kg"><option value="liter"><option value="bungkus"><option value="dus"><option value="karton"><option value="botol"><option value="butir"><option value="sak"><option value="kaleng"><option value="pak"><option value="pcs"></datalist>
 <div style="display:flex;gap:8px"><input id="gq" inputmode="decimal" placeholder="Jumlah" style="flex:.8" autocomplete="off"><input id="gu" list="gud" placeholder="Satuan" style="flex:1" autocomplete="off"><input id="gr" placeholder="Merek (opsional)" style="flex:1.3" autocomplete="off"></div>
 <button type="button" class="btn g" id="gad" style="width:100%;justify-content:center;margin-bottom:12px">Tambah barang</button>
 <div class="acts"><button class="btn g" id="cc" title="Batal" aria-label="Batal"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button class="btn del" id="dl" style="display:none" title="Hapus" aria-label="Hapus"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><button class="btn" id="sv" title="Simpan" aria-label="Simpan"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button></div>
</div></div>

<div class="modal" id="em"><div class="sheet">
 <h2 id="emt">Acara Baru</h2>
 <input id="en" placeholder="Nama acara (mis. Pernikahan Andi)">

const abOn=()=>{try{return localStorage.getItem("hajat_ab")!=="0"}catch(e){return true}};
const abSet=()=>{$("abk").querySelector("span").textContent="Cadangan otomatis: "+(abOn()?"Aktif":"Mati")};
if(window.AndroidSave){$("abk").style.display="flex";abSet()}
$("abk").onclick=()=>{try{localStorage.setItem("hajat_ab",abOn()?"0":"1")}catch(e){}abSet();if(abOn())bkSoon()};
let bkT;function bkSoon(){if(!window.AndroidSave||!abOn())return;clearTimeout(bkT);bkT=setTimeout(()=>{try{window.AndroidSave.put("Cadangan otomatis Catatan hajatan.txt",JSON.stringify({events,data,rems}),"text/plain",true)}catch(e){}},4000)}
let IR=[];
function schedRem(o){if(!NAT()||o.t<=Date.now())return;(async()=>{try{const p=await nat("LocalNotifications","requestPermissions");if(p.display!=="granted")return;await nat("LocalNotifications","schedule",{notifications:[{id:o.id,title:"Waktunya kembalikan buwuhan",body:o.n+(o.m?" · "+rp(o.m):"")+(o.b?" · "+o.b:""),schedule:{at:new Date(o.t).toISOString(),allowWhileIdle:true}}]})}catch(e){}})()}
function importRems(){const a=IR;IR=[];let n=0;a.forEach(r=>{if(!r||!r.n||!r.t)return;if(rems.some(x=>x.n===r.n&&x.t===+r.t&&(x.m||0)===(+r.m||0)))return;let id=Math.floor(Date.now()/1000)+n;while(rems.some(x=>x.id===id))id++;const o={id,n:r.n,m:+r.m||0,b:r.b||"",t:+r.t};rems.push(o);n++;schedRem(o)});if(n){saveR();rview()}return n}
$("xc").onclick=()=>xm.classList.remove("on");
$("xs").onclick=()=>{let n=xn.value.trim().replace(/[\\\/:*?"<>|]/g,"").replace(/\.(txt|csv)$/i,"").trim()||"Catatan hajatan";xm.classList.remove("on");if(xk==="csv")dl(n+".csv",csvText(),"text/csv");else dl(n+".txt",JSON.stringify({events,data,rems}),"text/plain")};
xn.addEventListener("keydown",e=>{if(e.key==="Enter")$("xs").click()});
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{
  let arr=[];
  if(/^[\s\uFEFF]*[\[{]/.test(rd.result)){const j=JSON.parse(rd.result.replace(/^\uFEFF/,""));if(Array.isArray(j))arr=j;else{IR=Array.isArray(j.rems)?j.rems:[];const mp={};(j.events||[]).forEach((x,i)=>{const ex=events.find(z=>z.n===x.n&&z.j===x.j);if(ex){mp[x.id]=ex.id;(x.bk||[]).forEach(b=>{if(!ex.bk.includes(b)&&ex.bk.length<6)ex.bk.push(b)})}else{const id=Date.now()+1000+i;mp[x.id]=id;events.push({id,n:x.n,j:x.j,bk:x.bk})}});arr=(j.data||[]).map(x=>({...x,_e:mp[x.e]}))}}
  else{const hk=/^"?kategori/i.test(rd.result.trim());rd.result.split(/\r?\n/).slice(1).forEach(l=>{if(!l.trim())return;const c=(l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"'));{const o=hk?1:0;arr.push({t:hk?c[0]:tab,n:c[o],a:c[o+1],m:parseInt(c[o+2])||0,k:c[o+3]||""})}})}
  const base=Date.now();let ok=0,sk=0;arr.filter(x=>x.n).forEach((x,i)=>{const E=events.find(z=>z.id===x._e)||ev(),t=E.bk.find(b=>b.toLowerCase()===String(x.t||"").toLowerCase())||(E===ev()?tab:E.bk[0]),m=+x.m||0,a=x.a||"";
   if(data.some(d=>d.e===E.id&&d.t===t&&d.n===x.n&&(d.a||"")===a&&d.m===m&&JSON.stringify(d.b||[])===JSON.stringify(Array.isArray(x.b)?x.b:[]))){sk++;return}
   data.push({id:base+i,e:E.id,n:x.n,a,m,k:x.k||"",b:Array.isArray(x.b)?x.b:[],t});ok++});
  save();saveE();const nr=importRems();render();ask({t:"Impor selesai",m:ok+" data masuk"+(nr?", "+nr+" pengingat":"")+(sk?", "+sk+" dilewati (sudah ada)":""),y:"OK",d:false,info:true})}catch(err){ask({t:"Gagal impor",m:"File tidak valid.",y:"OK",d:false,info:true})}};
 rd.readAsText(f);e.target.value="";
};

const AK="hajat_acc";
const hs=async x=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("hjt:"+x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of "hjt:"+x)h=((h<<5)+h+c.charCodeAt(0))>>>0;return"f"+h.toString(36)}};
let acc=null;try{acc=JSON.parse(localStorage.getItem(AK))}catch(e){}
const unlock=keep=>{try{(keep?localStorage:sessionStorage).setItem("hajat_in","1")}catch(e){}document.body.classList.remove("locked");render()};
const lock=()=>{try{localStorage.removeItem("hajat_in");sessionStorage.removeItem("hajat_in")}catch(e){}document.body.classList.add("locked");$("lp").value="";$("lp2").value="";$("le").textContent="";mode()};
function mode(){const n=!acc;$("lt").textContent=n?"Buat Akun":"Masuk";$("lb").textContent=n?"Daftar":"Masuk";$("lp2").style.display=n?"block":"none";$("lr").style.display=n?"none":"inline";$("lu").style.display="block";if(!n)$("lu").value=acc.u}
$("lb").onclick=async()=>{
 const u=$("lu").value.trim(),p=$("lp").value,e=$("le");e.textContent="";e.style.color="";
 if(!u||!p){e.textContent="Isi nama pengguna dan kata sandi";return}
 if(!acc){
  if(p.length<4){e.textContent="Kata sandi minimal 4 karakter";return}
  if(p!==$("lp2").value){e.textContent="Kata sandi tidak sama";return}
  acc={u,h:await hs(p)};try{localStorage.setItem(AK,JSON.stringify(acc))}catch(x){}
  $("lp").value="";$("lp2").value="";mode();e.style.color="var(--grn)";e.textContent="Akun dibuat. Silakan masuk dengan akun tadi.";$("lp").focus()
 }else if(u===acc.u&&await hs(p)===acc.h){unlock($("lk").checked)}
 else e.textContent="Nama pengguna atau kata sandi salah";
};
["lu","lp","lp2"].forEach(i=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")$("lb").click()}));
$("out").onclick=lock;
$("sk").onclick=()=>unlock(false);
const stc=()=>$("st").classList.remove("on");
$("gear").onclick=()=>$("st").classList.add("on");
$("stc").onclick=stc;$("st").onclick=e=>{if(e.target.id==="st")stc()};
["bak","csv","sum","imp","out"].forEach(i=>$(i).addEventListener("click",stc));
const PRE={Pernikahan:["Pengantin","Bapak","Ibu"],Pitonan:["Bapak","Ibu"],Khitan:["Anak","Bapak","Ibu"],Lainnya:["Bapak","Ibu"]};
const BASE=["Bapak","Ibu"];
function renderBk(sel){const OPTS=evJ==="Pernikahan"?["Pengantin",...BASE]:evJ==="Khitan"?["Anak",...BASE]:BASE;const all=[...OPTS,...sel.filter(x=>!OPTS.includes(x))];$("eb").innerHTML=all.map(k=>'<label class="ck"><input type="checkbox" value="'+esc(k)+'"'+(sel.includes(k)?" checked":"")+'><span>'+esc(k)+'</span></label>').join("")}
$("eb").onchange=e=>{if($("eb").querySelectorAll("input:checked").length>6){e.target.checked=false;ask({t:"Maksimal 6 buku",m:"Hapus centang buku lain dulu.",y:"OK",d:false,info:true})}};
let evId=null,evJ="Pernikahan";
const jset=()=>document.querySelectorAll("#ej button").forEach(b=>b.classList.toggle("on",b.dataset.j===evJ));
function openEv(id){evId=id;const E=events.find(x=>x.id===id);evJ=E?E.j:"Pernikahan";$("emt").textContent=id?"Ubah Acara":"Acara Baru";$("en").value=E?E.n:"";renderBk(E?E.bk:PRE[evJ]);$("edl").style.display=id?"inline-flex":"none";jset();$("em").classList.add("on");snapE=evv()}
let snapE="";const evv=()=>[$("en").value,evJ,[...$("eb").querySelectorAll("input:checked")].map(i=>i.value).join(",")].join("|");
const ecl=()=>$("em").classList.remove("on");
$("ej").onclick=e=>{const b=e.target.closest("button");if(!b)return;evJ=b.dataset.j;renderBk(PRE[evJ]);jset()};
$("ecc").onclick=async()=>{if(evv()===snapE||await ask({t:"Buang perubahan?",m:"Isian yang belum disimpan akan hilang.",y:"Buang"}))ecl()};$("em").onclick=e=>{if(e.target.id==="em"&&evv()===snapE)ecl()};
$("evm").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.ed){openEv(+b.dataset.ed);return}if(b.dataset.dx){delEv(+b.dataset.dx);return}if(b.dataset.ev==="new")openEv(null);else{curE=+b.dataset.ev;try{localStorage.setItem("hajat_cur",curE)}catch(x){}tab=tabs()[0];page=0;render()}};
$("esv").onclick=async()=>{
 const bk=[...$("eb").querySelectorAll("input:checked")].map(i=>i.value);if(!bk.length)bk.push("Umum");
 const n=$("en").value.trim()||evJ;
 if(evId){const E=events.find(x=>x.id===evId),gone=E.bk.filter(k=>!bk.includes(k));
  if(gone.length){const c=data.filter(d=>d.e===E.id&&gone.includes(d.t)).length;
   if(!await ask({t:"Hapus buku?",m:"Buku "+gone.join(", ")+" akan dihapus."+(c?"\n"+c+" tamu di dalamnya dipindah ke buku "+bk[0]+".":""),y:"Hapus"}))return}
  E.n=n;E.j=evJ;E.bk=bk;data.forEach(d=>{if(d.e===E.id&&!bk.includes(d.t))d.t=bk[0]});save()}
 else{const id=Date.now();events.push({id,n,j:evJ,bk});curE=id;tab=bk[0]}
 saveE();try{localStorage.setItem("hajat_cur",curE)}catch(x){}page=0;ecl();render()};
async function delEv(id){const E=events.find(x=>x.id===id);if(!E)return false;
 if(events.length<2){await ask({t:"Tidak bisa dihapus",m:"Minimal harus ada satu acara.",y:"Mengerti",d:false,info:true});return false}
 const c=data.filter(d=>d.e===id).length;
 if(!await ask({t:"Hapus acara?",m:'"'+E.n+'"'+(c?" beserta "+c+" data tamunya akan dihapus permanen.":" akan dihapus."),y:"Hapus"}))return false;
 events=events.filter(x=>x.id!==id);data=data.filter(d=>d.e!==id);if(curE==id)curE=events[0].id;save();saveE();try{localStorage.setItem("hajat_cur",curE)}catch(x){}tab=tabs()[0];page=0;render();return true}
$("edl").onclick=async()=>{if(await delEv(evId))ecl()};
$("lr").onclick=async()=>{if(await ask({t:"Reset akun?",m:"Semua data tamu di perangkat ini akan dihapus permanen. Ketik RESET untuk melanjutkan.",y:"Hapus semua",need:"RESET"})){try{localStorage.removeItem(AK);localStorage.removeItem(KEY)}catch(e){}acc=null;data=[];$("lu").value="";lock()}};
const RK="hajat_rem";let rems=[];try{rems=JSON.parse(localStorage.getItem(RK)||"[]")}catch(e){}if(!Array.isArray(rems))rems=[];
const saveR=()=>{try{localStorage.setItem(RK,JSON.stringify(rems))}catch(e){}bkSoon()};
const NAT=()=>{const C=window.Capacitor;return!!(C&&C.isNativePlatform&&C.isNativePlatform())};
const nat=(p,m,o)=>{const C=window.Capacitor;return C.nativePromise?C.nativePromise(p,m,o):C.Plugins[p][m](o)};
const fdt=t=>new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
function rview(){
 rems.sort((a,b)=>a.t-b.t);
 $("rl").innerHTML=rems.length?rems.map(r=>'<div class="rit'+(r.t<=Date.now()?" late":"")+'"><div style="min-width:0"><div class="nm">'+esc(r.n)+'</div><div class="ad">'+(r.m?rp(r.m)+" · ":"")+(r.b?esc(r.b)+" · ":"")+fdt(r.t)+'</div></div><button class="btn g" data-rx="'+r.id+'">Selesai</button></div>').join(""):'<div class="hint" style="margin:0 2px 6px">Belum ada pengingat.</div>';
 $("bdg").style.display=rems.length?"flex":"none";$("bdg").textContent=rems.length;
 $("rdl").innerHTML=[...new Set(data.filter(d=>d.e===ev().id).map(d=>d.n))].map(n=>'<option value="'+esc(n)+'">').join("")}
$("bell").onclick=()=>{rview();$("rmd").classList.add("on")};
$("rc").onclick=()=>$("rmd").classList.remove("on");
$("rmd").onclick=e=>{if(e.target.id==="rmd")$("rmd").classList.remove("on")};
$("rv").oninput=()=>{$("rv").value=fmt($("rv").value.replace(/\D/g,""))};
$("rn").oninput=()=>{const n=$("rn").value.trim().toLowerCase(),g=data.find(d=>d.e===ev().id&&d.n.toLowerCase()===n);if(!g)return;if(!$("rv").value&&g.m)$("rv").value=fmt(g.m);if(!$("rb").value&&g.b&&g.b.length)$("rb").value=itxt(g)};
const rinfo=(t,m)=>ask({t,m,y:"OK",d:false,info:true});
$("rs").onclick=async()=>{
 const n=$("rn").value.trim(),d=$("rd").value,tm=$("rt").value||"08:00";
 if(!n){$("rn").focus();return}
 if(!d){$("rd").focus();return}
 const t=new Date(d+"T"+tm).getTime();
 if(!(t>Date.now())){await rinfo("Waktu sudah lewat","Pilih tanggal dan jam yang akan datang.");return}
 const m=parseInt(($("rv").value||"0").replace(/\D/g,""))||0;
 const b=$("rb").value.trim();
 let id=Math.floor(Date.now()/1000);while(rems.some(r=>r.id===id))id++;
 if(NAT()){try{
  const p=await nat("LocalNotifications","requestPermissions");
  if(p.display!=="granted"){await rinfo("Izin notifikasi ditolak","Aktifkan izin notifikasi untuk aplikasi ini di pengaturan HP.");return}
  await nat("LocalNotifications","schedule",{notifications:[{id,title:"Waktunya kembalikan buwuhan",body:n+(m?" · "+rp(m):"")+(b?" · "+b:""),schedule:{at:new Date(t).toISOString(),allowWhileIdle:true}}]})
 }catch(e){await rinfo("Gagal mengatur notifikasi",String(e&&e.message||e));return}}
 rems.push({id,n,m,b,t});saveR();$("rn").value="";$("rv").value="";$("rb").value="";$("rd").value="";rview();$("rmd").classList.remove("on")};
$("rl").onclick=async e=>{const b=e.target.closest("[data-rx]");if(!b)return;const id=+b.dataset.rx,r=rems.find(x=>x.id===id);
 if(!r||!await ask({t:"Tandai selesai?",m:r.n+" akan dihapus dari pengingat.",y:"Selesai",d:false}))return;
 rems=rems.filter(x=>x.id!==id);saveR();if(NAT())nat("LocalNotifications","cancel",{notifications:[{id}]}).catch(()=>{});rview()};
mode();
try{if(acc&&(localStorage.getItem("hajat_in")||sessionStorage.getItem("hajat_in")))document.body.classList.remove("locked")}catch(e){}
render();rview();
</script>
