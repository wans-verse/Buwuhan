name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak proyek
        run: unzip -oq buwuhan.zip

      - name: Pasang ikon (kalau ada)
        run: |
          if ls ikon*.zip >/dev/null 2>&1; then
            unzip -oq ikon*.zip -d ikon
            mkdir -p app/src/main/res
            cp -r ikon/res/. app/src/main/res/
            if ls app/src/main/res/mipmap*/ic_launcher.* >/dev/null 2>&1; then
              sed -i 's#<application#<application android:icon="@mipmap/ic_launcher"#' app/src/main/AndroidManifest.xml
            fi
            if grep -rq '@color/ic_launcher_background' app/src/main/res && ! grep -rq 'name="ic_launcher_background"' app/src/main/res; then
              mkdir -p app/src/main/res/values
              echo '<resources><color name="ic_launcher_background">#FFFFFF</color></resources>' > app/src/main/res/values/ikon_warna.xml
            fi
          fi

      - name: Pakai keystore tetap dan naikkan versionCode
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode = 1$/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          grep -n "versionCode" app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Ganti nama file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Buwuhan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: buwuhan-apk
          path: Buwuhan.apk
