name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/local-notifications@7
          mkdir www
          cp index.html www/index.html
          npx cap init "Catatan Hajatan" com.hajatan.catatan --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><application#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/hajatan/catatan/MainActivity.java <<'EOF'
          package com.hajatan.catatan;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              super.onCreate(b);
              getBridge().getWebView().addJavascriptInterface(new Saver(), "AndroidSave");
            }
            class Saver {
              @JavascriptInterface
              public String put(String name, String text, String mime, boolean over) {
                try {
                  if (Build.VERSION.SDK_INT < 29) return "sdk";
                  ContentResolver cr = getContentResolver();
                  Uri base = MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                  Uri u = null;
                  if (over) {
                    Cursor c = cr.query(base, new String[]{MediaStore.MediaColumns._ID},
                      MediaStore.MediaColumns.DISPLAY_NAME + "=? AND " + MediaStore.MediaColumns.RELATIVE_PATH + "=?",
                      new String[]{name, Environment.DIRECTORY_DOWNLOADS + "/Catatan Hajatan/"}, null);
                    if (c != null) {
                      if (c.moveToFirst()) u = ContentUris.withAppendedId(base, c.getLong(0));
                      c.close();
                    }
                  }
                  if (u == null) {
                    ContentValues v = new ContentValues();
                    v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                    v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                    v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Catatan Hajatan");
                    u = cr.insert(base, v);
                  }
                  if (u == null) return "gagal";
                  OutputStream o = cr.openOutputStream(u, "wt");
                  o.write(text.getBytes("UTF-8"));
                  o.close();
                  return "ok";
                } catch (Exception e) { return "gagal"; }
              }
            }
          }
          EOF
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: catatan-hajatan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
